<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onit Technologies</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1200px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
    }

    .status {
      font-size: 1.4rem;
      font-weight: 500;
      color: #444;
      margin-top: 30px;
      margin-bottom: 40px;
      letter-spacing: 0.8px;
      text-align: center;
    }

    .content {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 60px;
      width: 100%;
      flex-wrap: wrap;
    }

    .logo-container {
      flex: 1;
      min-width: 300px;
      max-width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    .button-side {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
    }

    .contact-btn {
      display: inline-block;
      padding: 18px 50px;
      background-color: #d32f2f;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
    }

    .contact-btn:hover {
      background-color: #b71c1c;
      transform: translateY(-3px);
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        gap: 40px;
      }
      .logo-container {
        max-width: 80%;
      }
      .status {
        font-size: 1.2rem;
        margin-top: 25px;
        margin-bottom: 30px;
      }
      .contact-btn {
        font-size: 1.2rem;
        padding: 16px 40px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="content">
      <div class="logo-container">
        <img 
          src="Hero.jpeg" 
          alt="Onit Technologies Logo" 
          class="logo"
        />
      </div>

      <div class="button-side">
        <a href="mailto:hello@onit.je?subject=Inquiry%20from%20Onit%20Technologies%20website" class="contact-btn">
          Contact Us
        </a>
      </div>
    </div>

    <div class="status">Fine-tuning the signal – AV coming soon</div>
  </div>

</body>
</html>
