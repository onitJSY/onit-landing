<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onit Technologies</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-container {
      max-width: 90%;
      max-height: 80vh;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .contact-btn {
      display: inline-block;
      padding: 16px 40px;
      background-color: #d32f2f; /* red accent to stand out */
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      transition: background-color 0.3s ease;
      margin-top: 30px;
    }

    .contact-btn:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img 
      src="Hero.jpeg" 
      alt="Onit Technologies Logo" 
      class="logo"
    />
  </div>

  <a href="mailto:hello@onit.je?subject=Inquiry%20from%20Onit%20Technologies%20website" class="contact-btn">
    Contact Us
  </a>

</body>
</html>
